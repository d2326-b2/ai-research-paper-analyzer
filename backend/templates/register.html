<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — HypoGen AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: auto;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(124,58,237,0.12), transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(37,99,235,0.1), transparent 70%);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    .auth-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 32px 36px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #334155;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7c3aed, #2563eb);
      border-radius: 20px 20px 0 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .brand-dot {
      width: 10px; height: 10px;
      background: #2563eb;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37,99,235,0.6);
    }

    .brand-name { font-size: 1.1rem; font-weight: 700; color: white; }
    .brand-ai { color: #60a5fa; }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      color: white;
      margin-bottom: 4px;
    }

    .auth-sub { color: #64748b; font-size: 0.88rem; margin-bottom: 20px; }

    .error-msg {
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
    input::placeholder { color: #475569; }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: #6d28d9;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(124,58,237,0.3);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: #64748b;
      font-size: 0.88rem;
    }

    .auth-footer a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .password-hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="auth-card">

    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">HypoGen <span class="brand-ai">AI</span></span>
    </div>

    <h2>Create Account</h2>
    <p class="auth-sub">Start analyzing research papers for free</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 6 characters" required>
        <p class="password-hint">Must be at least 6 characters</p>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="/login">Sign in</a>
    </div>

  </div>
</body>
</html>
